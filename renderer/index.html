<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>便签 v2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-cute">

<header class="titlebar" id="titlebar">
  <span class="titlebar-brand">StickyNotes</span>
  <div class="titlebar-search">
    <svg class="search-icon" viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85zm-5.242.156a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
    <input type="text" class="global-search" id="search-input" placeholder="搜索便签...">
  </div>
  <div class="titlebar-actions">
    <div class="theme-dots" id="theme-dots">
      <span class="tdot active" data-theme="cute" style="background:#FFB6C1"></span>
      <span class="tdot" data-theme="minimal" style="background:#E0E0E0"></span>
      <span class="tdot" data-theme="hellokitty" style="background:#FF69B4"></span>
      <span class="tdot" data-theme="ocean" style="background:#38BDF8"></span>
      <span class="tdot" data-theme="forest" style="background:#4ADE80"></span>
      <span class="tdot" data-theme="sunset" style="background:#FB923C"></span>
      <span class="tdot" data-theme="lavender" style="background:#A78BFA"></span>
      <span class="tdot" data-theme="dark" style="background:#6B7280"></span>
    </div>
    <button class="win-btn" id="btn-minimize" title="最小化"><svg viewBox="0 0 10 1" width="10" height="10"><rect width="10" height="1" fill="currentColor"/></svg></button>
    <button class="win-btn win-btn-close" id="btn-close" title="退出"><svg viewBox="0 0 10 10" width="10" height="10"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.5" fill="none"/></svg></button>
  </div>
</header>

<div class="app-body">

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-block">
      <div class="sidebar-label">分区</div>
      <div class="collection-list" id="collection-list"></div>
      <input type="text" class="sidebar-input" id="collection-add-input" placeholder="+ 新建分区">
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-block">
      <div class="sidebar-label">时间</div>
      <div class="time-filters" id="time-filters">
        <button class="time-btn active" data-time="all">全部</button>
        <button class="time-btn" data-time="today">今天</button>
        <button class="time-btn" data-time="yesterday">昨天</button>
        <button class="time-btn" data-time="this_week">本周</button>
      </div>
    </div>
    <div class="sidebar-block">
      <input type="date" class="calendar-input" id="calendar-input">
      <div class="mini-calendar" id="mini-calendar"></div>
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-block">
      <div class="sidebar-label">标签</div>
      <div class="tag-list" id="tag-list"></div>
    </div>
  </nav>

  <section class="note-list-panel" id="note-list-panel">
    <div class="panel-header">
      <span class="panel-title">便签</span>
      <button class="btn-icon btn-new-accent" id="btn-new-note" title="新建便签 (Ctrl+N)">
        <svg viewBox="0 0 16 16" width="16" height="16"><path fill="currentColor" d="M8 1a1 1 0 011 1v5h5a1 1 0 110 2H9v5a1 1 0 11-2 0V9H2a1 1 0 010-2h5V2a1 1 0 011-1z"/></svg>
      </button>
    </div>
    <div class="note-list-scroll" id="notes-list">
      <div class="empty-hint" id="empty-state">
        <div class="empty-hint-icon">+</div>
        <div>暂无便签</div>
        <div class="empty-hint-sub">底部输入框快速创建，或 Ctrl+N</div>
      </div>
    </div>
  </section>

  <section class="editor-panel" id="editor-panel">
    <div class="editor-placeholder" id="editor-placeholder">
      <div class="placeholder-icon">
        <svg viewBox="0 0 48 48" width="48" height="48"><rect x="10" y="12" width="28" height="24" rx="2" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3"/><line x1="14" y1="20" x2="34" y2="20" stroke="currentColor" stroke-width="1.5" opacity="0.2"/><line x1="14" y1="25" x2="30" y2="25" stroke="currentColor" stroke-width="1.5" opacity="0.2"/><line x1="14" y1="30" x2="26" y2="30" stroke="currentColor" stroke-width="1.5" opacity="0.2"/></svg>
      </div>
      <div class="placeholder-text">选择便签开始编辑</div>
      <div class="placeholder-hint">Ctrl+N 创建 · Ctrl+S 保存</div>
    </div>
    <div class="editor-active" id="editor-active" style="display:none">
      <div class="editor-toolbar">
        <div class="editor-meta">
          <select class="editor-col-select" id="editor-collection-select"></select>
          <div class="editor-tags-row" id="editor-tags"></div>
        </div>
        <div class="editor-toolbar-actions">
          <button class="etb-btn etb-save" id="btn-save" title="保存 (Ctrl+S)">
            <svg viewBox="0 0 18 18" width="15" height="15"><path fill="currentColor" d="M3 2a1 1 0 00-1 1v12a1 1 0 001 1h12a1 1 0 001-1V6.414a1 1 0 00-.293-.707l-3.414-3.414A1 1 0 0011.586 2H3zm8 2v3H5V4h6zM5 9h8v5H5V9z"/></svg>
            <span>保存</span>
          </button>
          <button class="etb-btn etb-preview" id="btn-preview-toggle" title="切换预览">
            <svg class="pv-icon-edit" viewBox="0 0 18 18" width="15" height="15"><path fill="currentColor" d="M9 4C5.5 4 2.5 6.5 1.3 9c1.2 2.5 4.2 5 7.7 5s6.5-2.5 7.7-5C15.5 6.5 12.5 4 9 4zm0 8.3a3.3 3.3 0 110-6.6 3.3 3.3 0 010 6.6zM9 7a2 2 0 100 4 2 2 0 000-4z"/></svg>
            <svg class="pv-icon-preview" viewBox="0 0 18 18" width="15" height="15" style="display:none"><path fill="currentColor" d="M2 3a1 1 0 011-1h12a1 1 0 011 1v12a1 1 0 01-1 1H3a1 1 0 01-1-1V3zm2 1v10h2V4H4zm4 0v10h2V4H8zm4 0v10h2V4h-2z"/></svg>
            <span>预览</span>
          </button>
          <button class="etb-btn etb-delete" id="editor-delete" title="删除">
            <svg viewBox="0 0 18 18" width="15" height="15"><path fill="currentColor" d="M6 2a1 1 0 000 2h6a1 1 0 100-2H6zM3 5a1 1 0 011-1h10a1 1 0 011 1v10a2 2 0 01-2 2H5a2 2 0 01-2-2V5zm3 2v7h2V7H6zm4 0v7h2V7h-2z"/></svg>
            <span>删除</span>
          </button>
        </div>
      </div>
      <div class="editor-body" id="editor-body">
        <textarea class="editor-textarea" id="editor-textarea" placeholder="输入 Markdown... Ctrl+S 保存"></textarea>
        <div class="editor-preview markdown-body" id="editor-preview" style="display:none"></div>
      </div>
      <div class="editor-statusbar" id="editor-status"></div>
    </div>
  </section>

</div>

<div class="quick-add-bar" id="quick-add-bar">
  <select class="quick-col-select" id="quick-col-select"></select>
  <input type="text" class="quick-input" id="quick-input" placeholder="输入内容，Enter 快速创建便签...">
  <button class="quick-send-btn" id="quick-send-btn" title="创建 (Enter)">发送</button>
</div>

<footer class="statusbar">
  <span id="statusbar-info">就绪</span>
  <span class="statusbar-right" id="statusbar-collection">全部</span>
</footer>

<script src="marked.umd.js"></script>
<script src="renderer.js"></script>
</body>
</html>
